# Production stack for one VPS: docker compose -f deploy/compose.yml --env-file .env up -d --build
# Run from the repository root. See "Deploying" in the README.
name: kumbara

x-db-url: &db-url postgresql://kumbara:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kumbara?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kumbara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kumbara
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumbara"]
      interval: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: *db-url
      CRON_SECRET: ${CRON_SECRET}
      RECEIPTS_DIR: /data/receipts
    volumes:
      - receipts:/data/receipts
    depends_on:
      db:
        condition: service_healthy

  # HTTPS in front of the app. Caddy gets and renews the certificate for DOMAIN on its own.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - app

  # Daily jobs: fetch exchange rates, then back up the database and receipts.
  jobs:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/deploy/jobs.sh"]
    environment:
      PGHOST: db
      PGUSER: kumbara
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kumbara
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      RATES_AT: ${RATES_AT:-0 17 * * *}
      BACKUP_AT: ${BACKUP_AT:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ./:/deploy:ro
      - receipts:/data/receipts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  receipts:
  caddy:
